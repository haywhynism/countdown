<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
</head>

<body onload="" style="background-color: beige;">

    <div class="mx-auto" style="width: 300px !important;">
        <div class="mt-5">
            <h2 class="text-white mb-5"
                style="color: black !important; font-family: Arial, Helvetica, sans-serif !important; font-weight: 600 !important;">
                Count Timer</h2>

            <div class="d-flex gap-3 justify-content-center">
                <input class="w-25 p-2 text-center" id="hour" placeholder="Hour" 
                    style="outline: none; border: none; box-shadow: inset 1px 1px 5px 1px rgb(118, 118, 228);">
                <input class="w-25 p-2 text-center" id="minute" placeholder="Minutes" onkeyup="countDown()"
                    style="outline: none; border: none; box-shadow: inset 1px 1px 5px 1px rgb(183, 99, 99);">
                <input class="w-25 p-2 text-center" id="second" placeholder="Seconds" onkeyup="countDown()"
                    style="outline: none; border: none; box-shadow: inset 1px 1px 5px 1px rgb(88, 181, 215);">
            </div>



            <div id="display" class="text-white text-center mt-4 "
                style="font-size: 60px; clip-path: circle(); padding-top: 100px !important; background-color: rgb(135, 132, 85); height: 300px;">
                00:00:00</div>

            <div class="d-flex mt-3 gap-1">
                <button id="startBtn" class="col-6 p-4" onclick="start()"
                    style="clip-path: circle(); background-color: yellow; border: none;">Start</button> <br>
                <button class="col-6 p-4" onclick="pause()" style="clip-path: circle(); border: none;">Pause</button>

            </div>
            <button class="d-flex justify-content-center mx-auto p-4 " onclick="reset()"
                style="clip-path: circle(); background-color: bisque; border: none;">Reset</button>

        </div>
    </div>


    <script>

        let timer;
        let hou = 0;
        let min = 0;
        let sec = 0;

        const countDown=()=>{
            if (document.getElementById("minute").value > 59  ){
                alert("invalid number entered ");
            
                minute.value = ""

            } if (document.getElementById("second").value >59 ){
                     alert("invalid number entered ")
                     second.value = ""
                }
        }

        function updateDisplay() {
            document.getElementById("display").innerHTML =
                String(hou).padStart(2, '0') + ":" +
                String(min).padStart(2, '0') + ":" +
                String(sec).padStart(2, '0');
        }

        function start() {

            hou = Number(document.getElementById("hour").value) || 0;
            min = Number(document.getElementById("minute").value) || 0;
            sec = Number(document.getElementById("second").value) || 0;

            updateDisplay();

            document.getElementById("startBtn").style.backgroundColor == "yellow" ? ((document.getElementById("startBtn").style.backgroundColor = "lightGreen")) : document.getElementById("startBtn").style.backgroundColor = "yellow"

            timer = setInterval(() => {
                if (hou === 0 && min === 0 && sec === 0) {
                    return;
                } 

                sec--;

                hour.value = ""
                minute.value = ""
                second.value = ""

                if (sec < 0) {
                    sec = 59;
                    min--;

                    if (min < 0) {
                        min = 59;
                        hou--;

                        if (hou < 0) {
                            hou = 0;
                        }
                    }
                }
                updateDisplay();
            }, 1000);
        }

        function pause() {
            clearInterval(timer);
            localStorage.setItem("savedHr", hou);
            localStorage.setItem("savedMin", min);
            localStorage.setItem("savedSec", sec);
        }

        function reset() {
            clearInterval(timer);
            hou = 0;
            min = 0;
            sec = 0;
            updateDisplay();
            localStorage.clear(timer)
        }
    </script>

    <script src="bootstrap/js/bootstrap.js"></script>
</body>

</html>
